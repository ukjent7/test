version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/tests/grok-wire"]
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    groups:
      gui-driver:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
