name: Platform build and E2E

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      os:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: 1

jobs:
  build:
    name: Build and Clippy
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record build inputs
        run: |
          mkdir -p artifacts/build
          rustc --version --verbose > artifacts/build/toolchain.txt
          cargo tree --locked --depth 1 > artifacts/build/dependencies.txt
      - name: Lint and build gateway
        run: |
          cargo clippy --locked --release --bin messages-gateway -- -D warnings
          cargo build --locked --release
      - name: Fetch and build pinned Grok production decoder
        run: |
          python tests/fetch_grok_wire.py --output artifacts/build
          cargo build --locked --release --manifest-path tests/grok-wire/Cargo.toml --target-dir target
      - name: Package binaries and provenance
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/ci.py package --gateway "target/release/messages-gateway${suffix}" \
            --checker "target/release/grok-wire-check${suffix}" --output artifacts/build
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-${{ inputs.platform }}
          path: artifacts/build/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.platform }}
          path: artifacts/build/
          if-no-files-found: error

  e2e:
    name: ${{ matrix.group }} E2E
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [headless, gui]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ inputs.platform }}
          path: binaries
      - name: Linux runtime prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libxdo3
          chmod +x binaries/messages-gateway binaries/grok-wire-check
      - name: Install GUI E2E driver
        if: matrix.group == 'gui'
        timeout-minutes: 5
        run: python -m pip install -r tests/requirements.txt
      - name: Cache Linux E2E browser
        if: runner.os == 'Linux' && matrix.group == 'gui'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/requirements.txt') }}
      - name: Prepare Linux desktop and browser
        if: runner.os == 'Linux' && matrix.group == 'gui'
        timeout-minutes: 5
        run: |
          sudo apt-get install --no-install-recommends -y xvfb x11-utils dbus-x11 fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Run all suites in group
        env:
          GROUP: ${{ matrix.group }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          command=(python tests/run_e2e.py --gateway "binaries/messages-gateway${suffix}" \
            --checker "binaries/grok-wire-check${suffix}" --group "$GROUP" --output artifacts/evidence)
          if [[ "$GROUP" == "headless" ]]; then command+=(--check-pipeline); fi
          if [[ "$RUNNER_OS" == "Linux" && "$GROUP" == "gui" ]]; then
            dbus-run-session -- xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Upload complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ inputs.platform }}-${{ matrix.group }}
          path: artifacts/evidence/
          if-no-files-found: error
          retention-days: 30
