name: Messages gateway

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - name: Check E2E and frontend syntax
        run: |
          python -m compileall -q tests
          for file in ui/*.js; do node --input-type=module --check < "$file"; done

  platform:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    uses: ./.github/workflows/platform.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}

  ci-status:
    name: All checks passed
    if: always()
    needs: [quality, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          PLATFORMS: ${{ needs.platform.result }}
        run: test "$QUALITY" = success && test "$PLATFORMS" = success
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          path: verified-inputs
      - name: Verify coverage, evidence and release binary identity
        run: python tests/ci.py gate --artifacts verified-inputs --output release
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
      - name: Publish verification summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          verification = json.loads(Path("release/verification.json").read_text())
          print("| Platform | Suite | Passed cases |\n| --- | --- | ---: |")
          for platform, result in verification["platforms"].items():
              for suite in result["suites"]:
                  print(f"| {platform} | {suite['suite']} | {suite['cases']} |")
          PY

  release:
    name: Publish release
    needs: ci-status
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: release
      - name: Verify downloaded release files
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish verified binaries and evidence index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            echo "Release $tag already exists."
            exit 0
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --draft=false --latest
            exit 0
          fi
          cat > notes.md <<EOF
          提交：${GITHUB_SHA}
          [Windows/Linux 构建与完整 E2E](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) 全部通过。

          Windows x64 下载 messages-gateway.exe；Linux x64 下载 messages-gateway-linux-x64，运行前执行 chmod +x。
          SHA256SUMS 核验所有附件；verification.json 记录二进制哈希与各套 E2E 覆盖数量，junit.xml 提供完整用例索引。
          设置、请求历史与 WebView 数据保存在程序所在目录。
          EOF
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes-file notes.md --generate-notes --latest
