name: Messages gateway

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/grok-wire -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint and build gateway
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          cp Cargo.lock artifacts-cargo.lock
      - name: Fetch exact Grok production wire types
        run: python tests/fetch_grok_wire.py
      - name: Build Grok wire client
        env:
          RUSTFLAGS: -A dead_code
        run: cargo build --release --manifest-path tests/grok-wire/Cargo.toml
      - name: HTTP end-to-end regression
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          python tests/e2e.py --gateway "target/release/messages-gateway${suffix}" --checker "tests/grok-wire/target/release/grok-wire-check${suffix}"
      - name: Upload repeatable E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            artifacts/e2e/
            artifacts-cargo.lock
            tests/grok-wire/Cargo.lock
          if-no-files-found: warn
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: messages-gateway-${{ matrix.os }}
          path: |
            target/release/messages-gateway
            target/release/messages-gateway.exe
          if-no-files-found: error
