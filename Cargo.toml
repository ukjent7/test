[package]
name = "messages-gateway"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
dirs = "=7.0.0"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tao = "=0.37.1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "signal"] }
wry = "=0.57.0"
