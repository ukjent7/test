[package]
name = "messages-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.4"
futures-util = "=0.3.31"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
