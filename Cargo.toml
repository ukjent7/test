[package]
name = "messages-gateway"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
async-stream = "=0.3.6"
axum = "=0.8.9"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "socks"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tao = "=0.37.2"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "signal"] }
wry = "=0.57.1"

[profile.release]
codegen-units = 16
strip = "debuginfo"
